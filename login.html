<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | いつもの買い物</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card" aria-labelledby="login-title">
    <p class="app-name">いつもの買い物</p>
    <h1 id="login-title">ログイン</h1>
    <p class="instruction">家族グループへの接続を確認します</p>

    <div id="status" class="status" role="status" aria-live="polite">ログイン情報を入力してください。</div>

    <form id="login-form" novalidate>
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="submit-button" type="submit">ログインする</button>
    </form>

    <a id="shopping-link" class="shopping-link" href="index.html" hidden>買い物リストへ進む</a>
  </main>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
