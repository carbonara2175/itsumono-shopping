<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef6f1" />
    <title>Supabase接続テスト</title>
    <link rel="stylesheet" href="supabase-test.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="supabase-test.js" defer></script>
  </head>
  <body>
    <main class="test-shell">
      <header>
        <p class="phase-label">v2.0 DEVELOPMENT / PHASE 1</p>
        <h1>Supabase接続テスト</h1>
        <p>本番の買い物リストとは独立した、クラウド接続の学習用ページです。</p>
      </header>

      <section class="test-card" aria-labelledby="save-heading">
        <h2 id="save-heading">テスト商品を保存</h2>
        <form id="cloud-item-form">
          <label for="cloud-item-name">商品名</label>
          <div class="form-row">
            <input id="cloud-item-name" name="itemName" type="text" maxlength="100"
              placeholder="例）牛乳" autocomplete="off" required />
            <button id="save-button" type="submit">クラウドへ保存</button>
          </div>
        </form>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section class="test-card" aria-labelledby="items-heading">
        <div class="section-title">
          <h2 id="items-heading">クラウドに保存された商品</h2>
          <button id="reload-button" class="secondary-button" type="button">再読み込み</button>
        </div>
        <p id="loading-message">Supabaseから読み込んでいます…</p>
        <ul id="cloud-items" aria-live="polite"></ul>
        <p id="empty-message" hidden>保存されたテスト商品はありません。</p>
      </section>

      <p class="back-link"><a href="index.html">いつもの買い物へ戻る</a></p>
    </main>
  </body>
</html>
